services:
  - type: web
    name: tjspidexaibot
    runtime: python
    plan: starter        # free korte chaile: plan: free (kintu free ghumiye jay)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: email
        sync: false          # Render dashboard-e nije boshabe
      - key: password
        sync: false          # Render dashboard-e nije boshabe
      - key: API_KEY
        generateValue: true  # Render nijei secret key banabe
      - key: timezone
        value: UTC+6
      - key: RETENTION_MINUTES
        value: "10"
      - key: SAVE_TICKS
        value: "true"
      - key: STREAM_SYMBOLS
        value: ALL
      - key: MAX_STREAMS
        value: "20"
